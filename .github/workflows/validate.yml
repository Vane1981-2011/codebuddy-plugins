name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          python3 -m pip install --disable-pip-version-check pyyaml

      - name: Rebuild catalog and site
        run: |
          python3 scripts/build_catalog.py
          python3 scripts/build_site.py

      - name: Validate generated repository
        run: python3 scripts/validate_repo.py

      - name: Ensure generated files are committed
        run: git diff --exit-code
