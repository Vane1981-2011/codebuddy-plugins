name: Skill request
description: 提议一个新技能或对现有工作流做实质性升级
title: "[Skill] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        好的技能请求应该描述一个可重复出现的专业任务，而不是一个泛泛的主题。

  - type: input
    id: task
    attributes:
      label: 任务名称
      placeholder: 项目现金流滚动预测
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 谁在什么场景下遇到什么问题？当前做法为什么不够好？
    validations:
      required: true

  - type: textarea
    id: contract
    attributes:
      label: 输入、输出与验收
      description: 请分别说明最小输入、主要输出，以及怎样算完成。
      placeholder: |
        最小输入：
        主要输出：
        验收标准：
    validations:
      required: true

  - type: textarea
    id: workflow
    attributes:
      label: 建议的执行流程
      description: 至少给出 3 个可检查步骤。
    validations:
      required: true

  - type: textarea
    id: boundaries
    attributes:
      label: 不适用边界与风险
      description: 哪些场景不应使用？是否需要专业复核或敏感数据处理？
    validations:
      required: true

  - type: input
    id: references
    attributes:
      label: 可公开参考的资源
      description: 可提供公开论文、文档、开源项目或行业标准链接。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 这个请求描述的是可复用工作流，不是一次性内容。
          required: true
        - label: 我没有提交客户隐私、合同原文或未授权数据。
          required: true
